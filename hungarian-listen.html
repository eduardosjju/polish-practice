<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budapest — listen</title>
<style>
  :root{
    --ink:#f2ede2;
    --paper:#131210;
    --card:#1e1c19;
    --line:#38342d;
    --amber:#e8825a;
    --dust:#a49a88;
    --gold:#d9b65a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    line-height:1.5;
    padding:22px 16px 90px;
    max-width:560px;
    margin:0 auto;
  }
  header{margin-bottom:16px}
  .kicker{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:.7rem;letter-spacing:.18em;color:var(--dust);
    display:block;margin-bottom:8px;
  }
  h1{font-size:1.5rem;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
  .sub{color:var(--dust);font-size:.95rem;margin-bottom:18px}
  .controls{
    position:sticky;top:0;z-index:5;
    background:var(--paper);
    padding:10px 0 12px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .now{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    min-height:78px;
  }
  .now .pl{font-size:1.35rem;color:var(--amber);font-weight:600}
  .now .en{font-size:1rem;color:var(--dust);margin-top:4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{
    font-family:inherit;font-size:.9rem;
    background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;
    padding:9px 14px;cursor:pointer;
  }
  button.primary{background:var(--amber);color:#1a1410;border-color:var(--amber);font-weight:600}
  button.on{border-color:var(--gold);color:var(--gold)}
  .counter{font-family:ui-monospace,monospace;font-size:.8rem;color:var(--dust);margin-left:auto}
  .rate{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--dust);margin-top:8px}
  .rate button{padding:4px 10px}
  #novoice{
    display:none;background:#3a2418;border:1px solid #7a4a2a;
    color:#f0d0b8;border-radius:10px;padding:10px 12px;
    font-size:.82rem;margin-bottom:12px;line-height:1.45;
  }
  .list{margin-top:6px}
  .section{
    font-family:ui-monospace,monospace;font-size:.68rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dust);
    margin:18px 0 8px;
  }
  .row{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:8px;
    cursor:pointer;
  }
  .row.speaking{border-color:var(--amber);background:#241d18}
  .row .txt{flex:1}
  .row .pl{font-size:1.1rem;color:var(--ink);font-weight:600}
  .row .en{font-size:.88rem;color:var(--dust);margin-top:2px}
  .row .play{color:var(--amber);font-size:1.1rem}
  footer{color:var(--dust);font-size:.8rem;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<header>
  <span class="kicker">BUDAPEST · LISTEN, DON'T READ</span>
  <h1>Magyar — hands-free</h1>
  <div class="sub">Tap any line to hear it. Or hit Listen and let it run.</div>
</header>

<div id="novoice"></div>

<div class="controls">
  <div class="now">
    <div class="pl" id="nowPl">Ready</div>
    <div class="en" id="nowEn">tap Listen to begin</div>
  </div>
  <div class="btns">
    <button class="primary" id="playAll">▶︎ Listen</button>
    <button id="loopBtn" class="on">Loop: on</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="rate">
    speed
    <button id="slower">–</button>
    <span id="rateVal">1.0</span>
    <button id="faster">+</button>
  </div>
</div>

<div class="list" id="list"></div>

<footer>
  Hungarian voice needed or it'll sound wrong. iOS: Settings → Accessibility → Spoken Content → Voices → add Hungarian, then reload.
</footer>

<script>
const PHRASES = [
  {section:"Greetings & politeness"},
  {pl:"Jó reggelt", en:"Good morning"},
  {pl:"Jó napot", en:"Good day"},
  {pl:"Jó estét", en:"Good evening"},
  {pl:"Szia", en:"Hi or bye — casual"},
  {pl:"Viszlát", en:"Bye — neutral, safe on the way out"},
  {pl:"Köszönöm", en:"Thank you"},
  {pl:"Legyen szíves", en:"Please"},
  {pl:"Kérem", en:"I'd like / please (asking for something)"},
  {pl:"Szívesen", en:"You're welcome"},
  {pl:"Elnézést", en:"Excuse me, sorry"},
  {pl:"Igen", en:"Yes"},
  {pl:"Nem", en:"No"},
  {section:"Ordering & paying"},
  {pl:"Víz", en:"Water"},
  {pl:"Sör", en:"Beer"},
  {pl:"Kávé", en:"Coffee"},
  {pl:"A számlát, legyen szíves", en:"The bill, please"},
  {pl:"Két főre, legyen szíves", en:"Table for two, please"},
  {section:"Toasts"},
  {pl:"Egészségedre!", en:"Cheers! To your health!"},
  {pl:"Jó étvágyat!", en:"Enjoy your meal!"},
  {section:"Getting around"},
  {pl:"Mosdó", en:"Toilet, restroom"},
  {pl:"Bejárat", en:"Entrance"},
  {pl:"Kijárat", en:"Exit"},
  {section:"Counting 1–5"},
  {pl:"Egy, kettő, három, négy, öt", en:""},
];

let plRate = 1.0;
let loop = true;
let plVoice = null, enVoice = null;

function pickVoices(){
  const voices = speechSynthesis.getVoices();
  plVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("hu")) || null;
  enVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || null;
  const box = document.getElementById("novoice");
  if(!plVoice){
    box.style.display = "block";
    box.innerHTML = "⚠ <b>No Hungarian voice installed</b> — the Hungarian will sound wrong. iOS: Settings → Accessibility → Spoken Content → Voices → add <b>Hungarian</b>. Then reload.";
  } else {
    box.style.display = "none";
  }
}
speechSynthesis.onvoiceschanged = pickVoices;
pickVoices();

function utter(text, lang, voice, rate){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  if(voice) u.voice = voice;
  u.rate = rate;
  return u;
}

const list = document.getElementById("list");
const rows = [];
PHRASES.forEach((p) => {
  if(p.section){
    const s = document.createElement("div");
    s.className = "section";
    s.textContent = p.section;
    list.appendChild(s);
    return;
  }
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<div class="txt"><div class="pl">${p.pl}</div><div class="en">${p.en}</div></div><div class="play">▶︎</div>`;
  const idx = rows.length;
  el.addEventListener("click", () => speakPair(idx, false));
  list.appendChild(el);
  rows.push({pl:p.pl, en:p.en, el});
});

const nowPl = document.getElementById("nowPl");
const nowEn = document.getElementById("nowEn");
const counter = document.getElementById("counter");

function clearSpeaking(){ rows.forEach(r => r.el.classList.remove("speaking")); }

// If continuous=true, advances to next row on completion.
function speakPair(i, continuous){
  speechSynthesis.cancel();
  clearSpeaking();
  const r = rows[i];
  r.el.classList.add("speaking");
  r.el.scrollIntoView({behavior:"smooth", block:"center"});
  nowPl.textContent = r.pl;
  nowEn.textContent = "";
  counter.textContent = `${i+1} / ${rows.length}`;

  const uPl = utter(r.pl, "hu-HU", plVoice, plRate);
  uPl.onend = () => {
    nowEn.textContent = r.en;
    if(!r.en){ afterPair(i, continuous); return; }
    setTimeout(() => {
      const uEn = utter(r.en, "en-US", enVoice, 0.95);
      uEn.onend = () => afterPair(i, continuous);
      uEn.onerror = () => afterPair(i, continuous);
      speechSynthesis.speak(uEn);
    }, 250);
  };
  uPl.onerror = () => {
    nowEn.textContent = r.en;
    afterPair(i, continuous);
  };
  speechSynthesis.speak(uPl);
}

function afterPair(i, continuous){
  if(!continuous){
    rows[i].el.classList.remove("speaking");
    return;
  }
  if(!playing) return;
  const next = i + 1;
  if(next >= rows.length){
    if(loop){ setTimeout(() => { if(playing) speakPair(0, true); }, 700); }
    else { stopAll(); }
    return;
  }
  setTimeout(() => { if(playing) speakPair(next, true); }, 650);
}

let playing = false;
const playAllBtn = document.getElementById("playAll");
function stopAll(){
  playing = false;
  speechSynthesis.cancel();
  clearSpeaking();
  playAllBtn.textContent = "▶︎ Listen";
  nowPl.textContent = "Paused";
  nowEn.textContent = "tap Listen to resume from the top";
  counter.textContent = "";
}
playAllBtn.addEventListener("click", () => {
  if(playing){ stopAll(); return; }
  playing = true;
  playAllBtn.textContent = "■ Stop";
  speakPair(0, true);
});

document.getElementById("loopBtn").addEventListener("click", (e) => {
  loop = !loop;
  e.target.textContent = "Loop: " + (loop ? "on" : "off");
  e.target.classList.toggle("on", loop);
});
function setRate(r){
  plRate = Math.min(1.2, Math.max(0.5, Math.round(r*10)/10));
  document.getElementById("rateVal").textContent = plRate.toFixed(1);
}
document.getElementById("slower").addEventListener("click", () => setRate(plRate - 0.1));
document.getElementById("faster").addEventListener("click", () => setRate(plRate + 0.1));
</script>
</body>
</html>
